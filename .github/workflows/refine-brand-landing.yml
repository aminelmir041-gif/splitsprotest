name: Refine Brand Landing Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/refine-brand-landing.yml'

permissions:
  contents: write

jobs:
  refine-brand-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Refine brand landing flow
        run: python3 scripts/refine_brand_landing.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build React pages
        env:
          CI: 'false'
        run: npm run build

      - name: Publish brand routes
        run: |
          set -e
          rm -rf static
          cp -R build/static static
          ROUTES=(
            "split-systems/daikin"
            "split-systems/rinnai"
            "split-systems/mitsubishi-electric"
            "split-systems/mitsubishi-heavy-industries"
            "split-systems/fujitsu"
            "split-systems/samsung"
          )
          for route in "${ROUTES[@]}"; do
            mkdir -p "$route"
            cp build/index.html "$route/index.html"
          done
          cp build/asset-manifest.json asset-manifest.json 2>/dev/null || true

      - name: Commit refined brand landing pages
        run: |
          git config user.name "SplitsPro Brand Pages Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/BrandPage.jsx src/index.css static asset-manifest.json split-systems/daikin split-systems/rinnai split-systems/mitsubishi-electric split-systems/mitsubishi-heavy-industries split-systems/fujitsu split-systems/samsung
          if git diff --cached --quiet; then
            echo "No brand landing changes to publish"
            exit 0
          fi
          git commit -m "Refine brand landing pages and enlarge Zena finishes"
          git push
