name: Link Restored Pages From Homepage

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/link-restored-pages.yml'

permissions:
  contents: write

jobs:
  link-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Link homepage navigation to restored pages
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          text = text.replace(
              '<a class="logo" href="#home" aria-label="SplitsPro home">',
              '<a class="logo" href="./" aria-label="SplitsPro home">'
          )

          old_desktop = '<nav class="navlinks"><a href="#home">Home</a><a href="#split-systems">Split Systems</a><a href="#ducted">Ducted</a><a href="#cleaning">Cleaning</a><a href="#gallery">Gallery</a><a href="#service-areas">Service Areas</a><a href="#about">About</a><a href="#contact">Contact</a></nav>'
          new_desktop = '<nav class="navlinks"><a href="./">Home</a><a href="./split-systems/">Split Systems</a><a href="./ducted/">Ducted</a><a href="./cleaning/">Cleaning</a><a href="./gallery/">Gallery</a><a href="./service-areas/">Service Areas</a><a href="./about/">About</a><a href="./contact/">Contact</a></nav>'
          text = text.replace(old_desktop, new_desktop)

          old_mobile = '<div class="mobilemenu" id="mobilemenu"><div class="container"><a href="#home">Home</a><a href="#split-systems">Split Systems</a><a href="#ducted">Ducted</a><a href="#cleaning">Cleaning</a><a href="#gallery">Gallery</a><a href="#service-areas">Service Areas</a><a href="#about">About</a><a href="#contact">Contact</a><a class="call" href="tel:0414698435">Call 0414 698 435</a></div></div>'
          new_mobile = '<div class="mobilemenu" id="mobilemenu"><div class="container"><a href="./">Home</a><a href="./split-systems/">Split Systems</a><a href="./ducted/">Ducted</a><a href="./cleaning/">Cleaning</a><a href="./gallery/">Gallery</a><a href="./service-areas/">Service Areas</a><a href="./about/">About</a><a href="./contact/">Contact</a><a class="call" href="tel:0414698435">Call 0414 698 435</a></div></div>'
          text = text.replace(old_mobile, new_mobile)

          p.write_text(text, encoding='utf-8')
          PY

      - name: Commit navigation links
        run: |
          if git diff --quiet -- index.html; then
            echo "Homepage navigation is already linked"
            exit 0
          fi
          git config user.name "SplitsPro Pages Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Link homepage menu to restored pages"
          git push
