name: Retired Partial Cleaning Publisher

# The full site publisher compiles every React route against one shared
# bundle. Publishing only /split-system-cleaning while deleting /static can
# break /secure-cleaning and cause concurrent bundle rebase conflicts.
# This retired workflow is kept as a manually runnable informational check.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  use-full-site-publisher:
    runs-on: ubuntu-latest
    steps:
      - name: Use the single site-wide publishing workflow
        run: |
          echo "Use Publish Original SplitsPro Pages to deploy ALL React routes together."
          echo "No site files are changed by this workflow."
