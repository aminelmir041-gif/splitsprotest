name: Publish approved cleaning-page baby creative
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-approved-cleaning-baby.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save approved graphic as permanent website asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/landing landing
          curl --fail --location --retry 3 --max-time 100 -o public/landing/splitspro-cleaning-baby-approved.png 'https://media.canva.com/v2/document-image/hash:-2123134784/height:487/id:DAHX8uK-8QE/type:B/width:409?brand=BAFvr7TpwKQ&csig=AAAAAAAAAAAAAAAAAAAAAMkuhOjiYKAbcNKhsvBIbpogFU_iHTpwGnU-_GDgOSbV&disableexport=T&exp=1791944675&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FK-8QE%2FDAHX8uK-8QE%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261013%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261013T183631Z%26X-Amz-Expires%3D30784%26X-Amz-Signature%3D431891aafdbd1d4a1ac46c7c1d427673ce57bf2751f64967d681112c88d964b9%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DWed%252C%252014%2520Oct%25202026%252003%253A09%253A35%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAANi6XIPlFU35ng9wuDiL1Jwr112qn01itOGU3eZxPZVy&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1'
          file public/landing/splitspro-cleaning-baby-approved.png
          test $(wc -c < public/landing/splitspro-cleaning-baby-approved.png) -gt 15000
          cp public/landing/splitspro-cleaning-baby-approved.png landing/splitspro-cleaning-baby-approved.png
      - name: Commit website image
        run: |
          git config user.name 'SplitsPro Website Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/landing/splitspro-cleaning-baby-approved.png landing/splitspro-cleaning-baby-approved.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish approved cleaning baby image'
          git pull --rebase origin main
          git push
