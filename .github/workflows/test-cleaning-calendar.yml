name: Test shared SplitsPro booking rules
on:
  push:
    branches: [crm-lead-routing]
    paths:
      - "backend/cleaning_bookings.py"
      - "backend/render_app.py"
      - "backend/tests/test_cleaning_bookings.py"
      - ".github/workflows/test-cleaning-calendar.yml"
permissions:
  contents: read
jobs:
  booking-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend tests
        run: |
          python -m pip install -r backend/render_requirements.txt pytest fakeredis
      - name: Compile backend
        run: |
          python -m py_compile backend/cleaning_bookings.py backend/render_app.py
      - name: Test full prepayment, quantity, conflicts and holds
        run: |
          python -m pytest backend/tests/test_cleaning_bookings.py -q
