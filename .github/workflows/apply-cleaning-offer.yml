name: Apply cleaning offer updates

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'cleaning/**'
      - 'split-system-cleaning/**'
      - 'split-system-cleaning-offer/**'
      - 'cleaning-overrides.js'
      - '.github/workflows/apply-cleaning-offer.yml'

permissions:
  contents: write

jobs:
  update-live-pages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch live cleaning pages
        run: |
          python - <<'PY'
          from pathlib import Path

          loader = '<script defer src="/cleaning-overrides.js"></script>'
          for rel in ['cleaning/index.html', 'split-system-cleaning/index.html']:
              p = Path(rel)
              text = p.read_text(encoding='utf-8')
              if loader not in text:
                  text = text.replace('</head>', loader + '</head>')
                  p.write_text(text, encoding='utf-8')

          home = Path('index.html')
          text = home.read_text(encoding='utf-8')
          text = text.replace(
              'Thorough coil and filter cleaning for healthier air, cleaner systems and better efficiency.',
              'Split system cleaning from $100. Deep Clean $180 limited-time local offer in Bass Hill, Chester Hill and nearby suburbs. Ducted cleaning also available from $299.'
          )
          text = text.replace(
              '<a class="explore" href="#quote">Book a clean →</a>',
              '<a class="explore" href="./cleaning/">See cleaning options & prices →</a>'
          )
          text = text.replace(
              'Yes. We provide thorough coil and filter cleaning to improve air quality, efficiency and the lifespan of your system — ideal before summer.',
              'Yes. Split system Standard Cleans are $100, with a $180 Deep Clean limited-time local offer in Bass Hill, Chester Hill and selected nearby suburbs. We also offer ducted cleaning from $299.'
          )
          home.write_text(text, encoding='utf-8')

          offer = Path('split-system-cleaning-offer/index.html')
          if offer.exists():
              text = offer.read_text(encoding='utf-8')

              text = text.replace(
                  '<title>Limited Time Split System Cleaning Offer | SplitsPro</title>',
                  '<title>Split System Cleaning Bass Hill | $100 Clean & $180 Deep Clean | SplitsPro</title>'
              )
              text = text.replace(
                  '<meta name="description" content="Limited time split system cleaning offer from SplitsPro. Standard clean $100, deep clean $180, or two deep cleans at the same property for $300. Bass Hill, Yagoona, Greenacre, Chester Hill, Sefton and surrounding suburbs.">',
                  '<meta name="description" content="Split system air conditioner cleaning in Bass Hill, Yagoona, Greenacre, Chester Hill and Sefton. Standard clean $100, deep clean $180, or 2 deep cleans for $300 at the same property. Limited-time SplitsPro local offer.">'
              )

              if '<link rel="canonical" href="https://splitspro.com.au/split-system-cleaning-offer/">' not in text:
                  seo_head = '''  <link rel="canonical" href="https://splitspro.com.au/split-system-cleaning-offer/">\n  <meta name="robots" content="index,follow,max-image-preview:large">\n  <meta property="og:type" content="website">\n  <meta property="og:url" content="https://splitspro.com.au/split-system-cleaning-offer/">\n  <meta property="og:title" content="Split System Cleaning Bass Hill | Limited Time Offer | SplitsPro">\n  <meta property="og:description" content="Local split system cleaning from $100. Deep clean $180 or 2 deep cleans for $300 at the same property. Bass Hill, Yagoona, Greenacre, Chester Hill, Sefton and nearby suburbs.">\n  <meta property="og:image" content="https://splitspro.com.au/logo.png">\n  <meta name="twitter:card" content="summary_large_image">\n  <meta name="twitter:title" content="Split System Cleaning Bass Hill | SplitsPro">\n  <meta name="twitter:description" content="Standard clean $100, deep clean $180, or 2 deep cleans for $300 at the same property. Limited-time local offer.">\n'''
                  text = text.replace('  <meta name="theme-color" content="#0B0B0B">\n', seo_head + '  <meta name="theme-color" content="#0B0B0B">\n')

              if '"@type": "Service"' not in text:
                  schema = '''  <script type="application/ld+json">\n  {\n    "@context": "https://schema.org",\n    "@type": "Service",\n    "name": "Split System Air Conditioner Cleaning",\n    "serviceType": "Split system air conditioner cleaning and deep cleaning",\n    "url": "https://splitspro.com.au/split-system-cleaning-offer/",\n    "provider": {\n      "@type": "HVACBusiness",\n      "name": "SplitsPro",\n      "url": "https://splitspro.com.au/",\n      "telephone": "+61414698435",\n      "address": {\n        "@type": "PostalAddress",\n        "addressLocality": "Bass Hill",\n        "addressRegion": "NSW",\n        "addressCountry": "AU"\n      }\n    },\n    "areaServed": [\n      {"@type":"Place","name":"Bass Hill NSW"},\n      {"@type":"Place","name":"Yagoona NSW"},\n      {"@type":"Place","name":"Greenacre NSW"},\n      {"@type":"Place","name":"Chester Hill NSW"},\n      {"@type":"Place","name":"Sefton NSW"}\n    ],\n    "offers": [\n      {"@type":"Offer","name":"Standard Split System Clean","price":"100","priceCurrency":"AUD"},\n      {"@type":"Offer","name":"Deep Split System Clean","price":"180","priceCurrency":"AUD"},\n      {"@type":"Offer","name":"Two Deep Cleans Same Property","price":"300","priceCurrency":"AUD"}\n    ]\n  }\n  </script>\n'''
                  text = text.replace('  <link rel="icon" href="../logo.png">\n', '  <link rel="icon" href="../logo.png">\n' + schema)

              if '.seo-local{' not in text:
                  seo_css = '''\n    .seo-local{padding:78px 0;background:#fff;border-top:1px solid var(--line)}\n    .seo-local-inner{max-width:900px;margin:auto;text-align:center}\n    .seo-local h2{font-size:clamp(32px,4vw,46px);margin:12px 0 18px}\n    .seo-local p{margin:0 auto;max-width:820px;color:var(--muted);font-size:15px;line-height:1.75}\n    .seo-links{margin-top:20px;display:flex;justify-content:center;gap:22px;flex-wrap:wrap}\n    .seo-links a{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#9A6E32;border-bottom:1px solid #D8C39F;padding-bottom:4px}\n'''
                  text = text.replace('  </style>', seo_css + '  </style>')

              seo_section = '''\n    <section class="seo-local">\n      <div class="sp-container seo-local-inner">\n        <div class="eyebrow">Split System Cleaning Western Sydney</div>\n        <h2>Local air conditioner cleaning around Bass Hill.</h2>\n        <p>SplitsPro provides split system air conditioner cleaning and deep cleaning across Bass Hill, Yagoona, Greenacre, Chester Hill, Sefton and nearby suburbs. Our standard clean is designed for regular maintenance, while the deep clean targets heavier buildup around the evaporator coil, blower wheel, drain tray and accessible drain line to help restore cleaner airflow and keep your wall-mounted split system in better condition.</p>\n        <div class="seo-links"><a href="../cleaning/">See all cleaning services</a><a href="../split-system-cleaning/">Split system cleaning details</a><a href="../contact/">Contact SplitsPro</a></div>\n      </div>\n    </section>\n'''
              if 'Split System Cleaning Western Sydney' not in text:
                  text = text.replace('    <section class="areas">', seo_section + '\n    <section class="areas">')

              if '.review-proof{' not in text:
                  review_css = '''\n    .review-proof{background:#fff;border-bottom:1px solid var(--line);padding:58px 0}\n    .review-proof-grid{display:grid;grid-template-columns:.7fr 1.3fr;gap:70px;align-items:center}\n    .google-rating-pill{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:999px;box-shadow:0 7px 22px rgba(0,0,0,.05);font-size:13px;font-weight:700}\n    .google-rating-pill .stars{color:#FBBC04;letter-spacing:2px;font-size:15px}\n    .google-rating-pill strong{font-size:14px}\n    .google-rating-pill small{color:var(--muted);font-weight:600}\n    .review-proof h2{margin:18px 0 10px;font-size:clamp(32px,4vw,45px)}\n    .review-proof .proof-copy{color:var(--muted);font-size:14px;line-height:1.7;max-width:430px}\n    .google-link{display:inline-block;margin-top:16px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:#9A6E32;border-bottom:1px solid #D8C39F;padding-bottom:4px}\n    .review-quote{margin:0;padding:34px 0 34px 34px;border-left:1px solid #D7C6A6}\n    .review-stars{color:#FBBC04;letter-spacing:3px;font-size:18px}\n    .review-quote blockquote{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.5;color:var(--ink);margin:16px 0 22px}\n    .review-author{font-size:13px;font-weight:800;color:var(--ink)}\n    .review-meta{margin-top:4px;font-size:12px;color:var(--muted)}\n    @media(max-width:800px){.review-proof-grid{grid-template-columns:1fr;gap:34px}.review-quote{padding:28px 0 0;border-left:0;border-top:1px solid #D7C6A6}.review-quote blockquote{font-size:21px}}\n'''
                  text = text.replace('  </style>', review_css + '  </style>')

              review_section = '''\n    <section class="review-proof" aria-label="Google reviews">\n      <div class="sp-container review-proof-grid">\n        <div>\n          <div class="google-rating-pill"><span class="stars">★★★★★</span><strong>5.0 Google Rating</strong><small>26 reviews</small></div>\n          <h2>Trusted by local homeowners.</h2>\n          <p class="proof-copy">Real Google feedback from customers who chose SplitsPro for their home air conditioning.</p>\n          <a class="google-link" href="https://g.page/r/CYTvO1ipeYUtEBM/" target="_blank" rel="noreferrer">View SplitsPro on Google →</a>\n        </div>\n        <figure class="review-quote">\n          <div class="review-stars" aria-label="5 star review">★★★★★</div>\n          <blockquote>“We had the most fantastic experience with Splits Pro. They were professional from the initial quote through to installation, explained every option clearly, and completed the job to an exceptionally high standard. The workmanship was clean, efficient and we couldn't be happier. Highly recommended.”</blockquote>\n          <figcaption><div class="review-author">Sia</div><div class="review-meta">Google Review · Split System Installation</div></figcaption>\n        </figure>\n      </div>\n    </section>\n'''
              if 'class="review-proof"' not in text:
                  trust_line = '    <div class="trust"><div class="sp-container trust-row"><span>5.0 Google Rating</span><span>Licensed &amp; Insured</span><span>Local Western Sydney Team</span><span>Quality Workmanship</span></div></div>'
                  text = text.replace(trust_line, trust_line + '\n' + review_section)

              offer.write_text(text, encoding='utf-8')
          PY

      - name: Commit live page updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html cleaning/index.html split-system-cleaning/index.html split-system-cleaning-offer/index.html
          if git diff --cached --quiet; then
            echo "No live-page changes needed"
            exit 0
          fi
          git commit -m "Publish cleaning offer trust proof"
          git push
