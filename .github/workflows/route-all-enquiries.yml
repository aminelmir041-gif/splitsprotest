name: Route All Website Enquiries

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/route-all-enquiries.yml'
      - 'scripts/route-all-enquiries.py'
      - 'src/components/QuoteForm.jsx'
      - 'src/lib/api.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  route-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Route static enquiry forms
        run: python3 scripts/route-all-enquiries.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build React enquiry pages
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: 'https://splitspro-leads.onrender.com'
        run: npm run build

      - name: Publish React route pages
        run: |
          set -e
          rm -rf static
          cp -R build/static static
          cp build/asset-manifest.json asset-manifest.json 2>/dev/null || true
          ROUTES=(
            "about"
            "split-systems"
            "split-systems/oran-park"
            "split-systems/willoughby-north-sydney"
            "split-systems/central-coast-newcastle"
            "split-systems/wollongong"
            "split-systems/quakers-hill-austral-richmond"
            "split-systems/daikin"
            "split-systems/rinnai"
            "split-systems/mitsubishi"
            "split-systems/mitsubishi-electric"
            "split-systems/mitsubishi-heavy-industries"
            "split-systems/fujitsu"
            "split-systems/samsung"
            "split-systems/panasonic"
            "ducted"
            "cleaning"
            "split-system-cleaning"
            "ducted-cleaning"
            "repairs"
            "servicing"
            "gallery"
            "reviews"
            "service-areas"
            "faq"
            "contact"
          )
          for route in "${ROUTES[@]}"; do
            mkdir -p "$route"
            cp build/index.html "$route/index.html"
          done

      - name: Commit live enquiry routing
        run: |
          git config user.name "SplitsPro Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html split-system-cleaning-offer/index.html src/lib/api.js static asset-manifest.json \
            about split-systems ducted cleaning split-system-cleaning ducted-cleaning repairs servicing gallery reviews service-areas faq contact
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Send all website enquiries to SplitsPro backend"
            git pull --rebase origin main
            git push origin main
          fi
