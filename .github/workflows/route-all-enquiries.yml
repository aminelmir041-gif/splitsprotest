name: Route All Website Enquiries

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/route-all-enquiries.yml'
      - 'scripts/route-all-enquiries.py'
      - 'scripts/harden-booking-route.py'
      - 'src/components/QuoteForm.jsx'
      - 'src/lib/api.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: splitspro-site-publish
  cancel-in-progress: false

jobs:
  route-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Route static enquiry forms
        run: python3 scripts/route-all-enquiries.py

      - name: Commit live enquiry routing
        run: |
          git config user.name "SplitsPro Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html split-system-cleaning-offer/index.html src/lib/api.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Send all website enquiries to SplitsPro backend"
            git pull --rebase origin main
            git push origin main
          fi
