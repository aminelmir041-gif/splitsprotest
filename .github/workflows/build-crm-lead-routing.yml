name: Build CRM Lead Routing

on:
  push:
    branches:
      - crm-lead-routing
    paths:
      - '.github/workflows/build-crm-lead-routing.yml'
      - 'src/lib/api.js'
      - 'src/lib/attribution.js'
      - 'src/components/QuoteForm.jsx'
      - 'scripts/apply-lead-routing.py'
      - 'backend/render_app.py'
      - 'backend/lead_integrations.py'
      - 'backend/render_requirements.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: crm-lead-routing

      - name: Apply lead routing patches
        run: python3 scripts/apply-lead-routing.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build React routes
        env:
          CI: 'false'
        run: npm run build

      - name: Publish React routes on feature branch
        run: |
          set -e
          rm -rf static
          cp -R build/static static
          cp build/asset-manifest.json asset-manifest.json 2>/dev/null || true
          ROUTES=(
            "about"
            "split-systems"
            "split-systems/oran-park"
            "split-systems/willoughby-north-sydney"
            "split-systems/central-coast-newcastle"
            "split-systems/wollongong"
            "split-systems/quakers-hill-austral-richmond"
            "split-systems/daikin"
            "split-systems/rinnai"
            "split-systems/mitsubishi"
            "split-systems/mitsubishi-electric"
            "split-systems/mitsubishi-heavy-industries"
            "split-systems/fujitsu"
            "split-systems/samsung"
            "split-systems/panasonic"
            "ducted"
            "cleaning"
            "split-system-cleaning"
            "ducted-cleaning"
            "repairs"
            "servicing"
            "gallery"
            "reviews"
            "service-areas"
            "faq"
            "contact"
          )
          for route in "${ROUTES[@]}"; do
            mkdir -p "$route"
            cp build/index.html "$route/index.html"
          done

      - name: Commit generated branch build
        run: |
          git config user.name "SplitsPro Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            index.html public/index.html src/components/QuoteForm.jsx \
            static asset-manifest.json \
            about split-systems ducted cleaning split-system-cleaning ducted-cleaning \
            repairs servicing gallery reviews service-areas faq contact
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build CRM lead routing changes"
            git pull --rebase origin crm-lead-routing
            git push origin crm-lead-routing
          fi
