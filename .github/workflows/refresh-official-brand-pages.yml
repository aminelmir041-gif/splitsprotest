name: Refresh Official Brand Pages

on:
  push:
    paths:
      - '.github/workflows/refresh-official-brand-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply official brand page updates
        run: |
          python3 scripts/refresh-official-brand-pages.py
          python3 scripts/fix-split-booking-copy.py
          python3 - <<'PY'
          from pathlib import Path

          # Keep Samsung on the clean official indoor-unit product image.
          p = Path("src/pages/BrandPage.jsx")
          text = p.read_text(encoding="utf-8")
          samsung = '  "geo-windfree": "https://images.samsung.com/is/image/samsung/p6pim/au/ar09dxeanwknsa/gallery/au-ar9500tar10dyeabwknst-ar09dxeanwknsa-554025806?%241164_776_PNG%24=",\n'
          if samsung not in text:
              marker = '  "heavy-ciara": "https://www.mhiaa.com.au/wp-content/uploads/2024/01/MHIAA_Ciara_WebHeroImage_588x330px_06.26-1.jpg",\n'
              if marker not in text:
                  raise SystemExit("Samsung image insertion point not found")
              text = text.replace(marker, marker + samsung, 1)

          # Use the Daikin editorial install layout for any brand with installEditorial.
          text = text.replace(
              '{brand.slug === "daikin" ? (\n        <DaikinIntroEditorial brand={brand} jumpToRange={jumpToRange} />',
              '{brand.installEditorial ? (\n        <DaikinIntroEditorial brand={brand} jumpToRange={jumpToRange} />',
              1,
          )
          p.write_text(text, encoding="utf-8")

          # Rinnai: use the two exact customer install photos uploaded in chat,
          # plus Gill McPhee's supplied Google review.
          p = Path("src/lib/data.js")
          text = p.read_text(encoding="utf-8")
          old = '''    installEditorial: {\n      primary: {\n        src: IMAGES.outdoorRinnai2,\n        alt: "Rinnai outdoor split system installation by SplitsPro",\n      },\n      secondary: {\n        src: IMAGES.installRinnaiWall,\n        alt: "Rinnai indoor split system installation by SplitsPro",\n      },\n    },\n'''
          new = '''    installEditorial: {\n      primary: {\n        src: `${PUBLIC}/installs/rinnai-outdoor.webp`,\n        alt: "Rinnai outdoor split system installation completed by SplitsPro",\n      },\n      secondary: {\n        src: `${PUBLIC}/installs/rinnai-indoor.webp`,\n        alt: "Rinnai indoor split system installation completed by SplitsPro",\n      },\n      review: {\n        text: "Excellent installers. They work very well as a team. Heatwave arrives tomorrow, 34 degrees, and we have cooling! So happy.",\n        author: "Gill McPhee",\n      },\n    },\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Existing Rinnai install editorial block not found")
          p.write_text(text, encoding="utf-8")

          # Make the editorial review brand-specific. Daikin keeps its existing review.
          p = Path("src/components/DaikinIntroEditorial.jsx")
          text = p.read_text(encoding="utf-8")
          if 'const review = installs?.review' not in text:
              text = text.replace(
                  '  const installs = brand.installEditorial;\n',
                  '''  const installs = brand.installEditorial;\n  const review = installs?.review || (brand.slug === "daikin"\n    ? { text: "Best in the business, amazing work.", author: "Mat 134" }\n    : null);\n''',
                  1,
              )

          old_review = '''              <blockquote className="absolute bottom-[2%] left-[2%] z-10 max-w-[315px] sm:left-[4%] lg:left-[6%]">\n                <div className="text-[14px] tracking-[0.10em] text-[#FBBC04]">★★★★★</div>\n                <p className="mt-2 font-serif text-[20px] italic leading-[1.35] text-[#343842] sm:text-[22px]">\n                  “Best in the business, amazing work.”\n                </p>\n                <footer className="mt-2 text-[11px] font-semibold uppercase tracking-[0.16em] text-[#7A7D83]">\n                  Mat 134 · Google Review\n                </footer>\n              </blockquote>\n'''
          new_review = '''              {review && (\n                <blockquote className="absolute bottom-[2%] left-[2%] z-10 max-w-[315px] sm:left-[4%] lg:left-[6%]">\n                  <div className="text-[14px] tracking-[0.10em] text-[#FBBC04]">★★★★★</div>\n                  <p className="mt-2 font-serif text-[20px] italic leading-[1.35] text-[#343842] sm:text-[22px]">\n                    “{review.text}”\n                  </p>\n                  <footer className="mt-2 text-[11px] font-semibold uppercase tracking-[0.16em] text-[#7A7D83]">\n                    {review.author} · Google Review\n                  </footer>\n                </blockquote>\n              )}\n'''
          if old_review in text:
              text = text.replace(old_review, new_review, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build site
        env:
          CI: 'false'
        run: npm run build

      - name: Publish all React routes
        run: |
          set -e
          rm -rf static products installs
          cp -R build/static static
          if [ -d build/products ]; then
            cp -R build/products products
          fi
          if [ -d build/installs ]; then
            cp -R build/installs installs
          fi
          ROUTES=(
            "about" "split-systems" "split-systems/daikin" "split-systems/rinnai"
            "split-systems/mitsubishi" "split-systems/mitsubishi-electric"
            "split-systems/mitsubishi-heavy-industries" "split-systems/fujitsu"
            "split-systems/samsung" "ducted" "cleaning" "repairs" "servicing"
            "gallery" "reviews" "service-areas" "faq" "contact"
          )
          for route in "${ROUTES[@]}"; do
            mkdir -p "$route"
            cp build/index.html "$route/index.html"
          done
          cp build/asset-manifest.json asset-manifest.json 2>/dev/null || true

      - name: Commit refreshed site
        run: |
          git config user.name "SplitsPro Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/BrandPage.jsx src/components/DaikinIntroEditorial.jsx src/lib/data.js src/components/QuoteForm.jsx src/pages/HomeComfortPage.jsx src/pages/SplitSystems.jsx static products installs asset-manifest.json about split-systems ducted cleaning repairs servicing gallery reviews service-areas faq contact
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use uploaded Rinnai installs and Gill review"
            git push
          fi
