name: Refresh Official Brand Pages

on:
  push:
    paths:
      - '.github/workflows/refresh-official-brand-pages.yml'
      - 'src/components/DaikinIntroEditorial.jsx'
      - 'src/components/DuctedPricingSelector.jsx'
      - 'src/components/QuoteForm.jsx'
      - 'src/pages/Ducted.jsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply official brand page updates
        run: |
          python3 scripts/refresh-official-brand-pages.py
          python3 scripts/fix-split-booking-copy.py
          python3 - <<'PY'
          from pathlib import Path

          # Samsung: use the clean locally hosted indoor-unit product render.
          # Remove the external Samsung gallery override because Samsung can
          # serve extra room-size marketing copy with that asset.
          p = Path("src/pages/BrandPage.jsx")
          text = p.read_text(encoding="utf-8")
          samsung = '  "geo-windfree": "https://images.samsung.com/is/image/samsung/p6pim/au/ar09dxeanwknsa/gallery/au-ar9500tar10dyeabwknst-ar09dxeanwknsa-554025806?%241164_776_PNG%24=",\n'
          text = text.replace(samsung, "")

          # Use the Daikin editorial install layout for any brand with installEditorial.
          text = text.replace(
              '{brand.slug === "daikin" ? (\n        <DaikinIntroEditorial brand={brand} jumpToRange={jumpToRange} />',
              '{brand.installEditorial ? (\n        <DaikinIntroEditorial brand={brand} jumpToRange={jumpToRange} />',
              1,
          )
          p.write_text(text, encoding="utf-8")

          # Rinnai: use the two exact customer install photos uploaded in chat,
          # plus Gill McPhee's supplied Google review.
          p = Path("src/lib/data.js")
          text = p.read_text(encoding="utf-8")
          old = '''    installEditorial: {\n      primary: {\n        src: IMAGES.outdoorRinnai2,\n        alt: "Rinnai outdoor split system installation by SplitsPro",\n      },\n      secondary: {\n        src: IMAGES.installRinnaiWall,\n        alt: "Rinnai indoor split system installation by SplitsPro",\n      },\n    },\n'''
          new = '''    installEditorial: {\n      primary: {\n        src: `${PUBLIC}/installs/rinnai-outdoor.webp`,\n        alt: "Rinnai outdoor split system installation completed by SplitsPro",\n      },\n      secondary: {\n        src: `${PUBLIC}/installs/rinnai-indoor.webp`,\n        alt: "Rinnai indoor split system installation completed by SplitsPro",\n      },\n      review: {\n        text: "Excellent installers. They work very well as a team. Heatwave arrives tomorrow, 34 degrees, and we have cooling! So happy.",\n        author: "Gill McPhee",\n      },\n    },\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Existing Rinnai install editorial block not found")
          p.write_text(text, encoding="utf-8")

          # Make the editorial review brand-specific. Daikin keeps its existing review.
          p = Path("src/components/DaikinIntroEditorial.jsx")
          text = p.read_text(encoding="utf-8")
          if 'const review = installs?.review' not in text:
              text = text.replace(
                  '  const installs = brand.installEditorial;\n',
                  '''  const installs = brand.installEditorial;\n  const review = installs?.review || (brand.slug === "daikin"\n    ? { text: "Best in the business, amazing work.", author: "Mat 134" }\n    : null);\n''',
                  1,
              )
          p.write_text(text, encoding="utf-8")

          # Ducted pricing: make Rinnai the value option and reduce Daikin by $1,000.
          # Exact block replacements keep all other brands unchanged and are idempotent.
          p = Path("src/components/DuctedPricingSelector.jsx")
          text = p.read_text(encoding="utf-8")
          replacements = [
              ('''    daikin: [\n      { kw: "7.1kW", price: "$5,590" },\n      { kw: "8.5kW", price: "$6,290" },\n      { kw: "10.0kW", price: "$7,090" },\n      { kw: "12.5kW", price: "$8,990" },\n      { kw: "14.0kW", price: "$9,790" },\n    ],''', '''    daikin: [\n      { kw: "7.1kW", price: "$4,590" },\n      { kw: "8.5kW", price: "$5,290" },\n      { kw: "10.0kW", price: "$6,090" },\n      { kw: "12.5kW", price: "$7,990" },\n      { kw: "14.0kW", price: "$8,790" },\n    ],'''),
              ('''    daikin: [\n      { kw: "10.0kW", price: "$9,490" },\n      { kw: "12.5kW", price: "$10,390" },\n      { kw: "14.0kW", price: "$11,290" },\n      { kw: "16.0kW", price: "$12,090" },\n    ],''', '''    daikin: [\n      { kw: "10.0kW", price: "$8,490" },\n      { kw: "12.5kW", price: "$9,390" },\n      { kw: "14.0kW", price: "$10,290" },\n      { kw: "16.0kW", price: "$11,090" },\n    ],'''),
              ('''    daikin: [\n      { kw: "12.5kW", price: "$11,390" },\n      { kw: "14.0kW", price: "$12,290" },\n      { kw: "16.0kW", price: "$12,990" },\n    ],''', '''    daikin: [\n      { kw: "12.5kW", price: "$10,390" },\n      { kw: "14.0kW", price: "$11,290" },\n      { kw: "16.0kW", price: "$11,990" },\n    ],'''),
              ('''    rinnai: [\n      { kw: "7.3kW", price: "$7,390" },\n      { kw: "9.0kW", price: "$7,890" },\n      { kw: "10.5kW", price: "$8,490" },\n      { kw: "12.5kW", price: "$8,990" },\n      { kw: "14.0kW", price: "$9,490" },\n    ],''', '''    rinnai: [\n      { kw: "7.3kW", price: "$4,490" },\n      { kw: "9.0kW", price: "$5,290" },\n      { kw: "10.5kW", price: "$6,090" },\n      { kw: "12.5kW", price: "$7,490" },\n      { kw: "14.0kW", price: "$7,990" },\n    ],'''),
              ('''    rinnai: [\n      { kw: "10.5kW", price: "$9,590" },\n      { kw: "12.5kW", price: "$10,190" },\n      { kw: "14.0kW", price: "$10,790" },\n      { kw: "17.0kW", price: "$11,990" },\n    ],''', '''    rinnai: [\n      { kw: "10.5kW", price: "$6,990" },\n      { kw: "12.5kW", price: "$7,990" },\n      { kw: "14.0kW", price: "$8,590" },\n      { kw: "17.0kW", price: "$9,990" },\n    ],'''),
              ('''    rinnai: [\n      { kw: "12.5kW", price: "$11,190" },\n      { kw: "14.0kW", price: "$11,790" },\n      { kw: "17.0kW", price: "$12,990" },\n    ],''', '''    rinnai: [\n      { kw: "12.5kW", price: "$8,990" },\n      { kw: "14.0kW", price: "$9,590" },\n      { kw: "17.0kW", price: "$10,990" },\n    ],'''),
          ]
          for old_block, new_block in replacements:
              if old_block in text:
                  text = text.replace(old_block, new_block, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build site
        env:
          CI: 'false'
        run: npm run build

      - name: Publish all React routes
        run: |
          set -e
          rm -rf static products installs
          cp -R build/static static
          if [ -d build/products ]; then
            cp -R build/products products
          fi
          if [ -d build/installs ]; then
            cp -R build/installs installs
          fi
          ROUTES=(
            "about" "split-systems" "split-systems/daikin" "split-systems/rinnai"
            "split-systems/mitsubishi" "split-systems/mitsubishi-electric"
            "split-systems/mitsubishi-heavy-industries" "split-systems/fujitsu"
            "split-systems/samsung" "ducted" "cleaning" "repairs" "servicing"
            "gallery" "reviews" "service-areas" "faq" "contact"
          )
          for route in "${ROUTES[@]}"; do
            mkdir -p "$route"
            cp build/index.html "$route/index.html"
          done
          cp build/asset-manifest.json asset-manifest.json 2>/dev/null || true

      - name: Commit refreshed site
        run: |
          git config user.name "SplitsPro Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/BrandPage.jsx src/components/DaikinIntroEditorial.jsx src/components/DuctedPricingSelector.jsx src/lib/data.js src/components/QuoteForm.jsx src/pages/HomeComfortPage.jsx src/pages/SplitSystems.jsx src/pages/Ducted.jsx static products installs asset-manifest.json about split-systems ducted cleaning repairs servicing gallery reviews service-areas faq contact
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Deploy ducted pricing selector"
            git push
          fi
