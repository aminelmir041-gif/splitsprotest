name: Publish Installation Checkout

on:
  push:
    paths:
      - 'src/pages/InstallationBooking.jsx'
      - 'src/pages/InstallationDepositCheckout.jsx'
      - 'src/components/FloatingCTA.jsx'
      - 'src/App.js'
      - '.github/workflows/publish-installation-checkout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build site
        env:
          CI: 'false'
        run: npm run build

      - name: Publish booking routes
        run: |
          set -e
          mkdir -p static
          cp -R build/static/* static/
          cp build/asset-manifest.json asset-manifest.json
          mkdir -p book-installation secure-installation
          cp build/index.html book-installation/index.html
          cp build/index.html secure-installation/index.html

      - name: Commit built site
        run: |
          git config user.name "SplitsPro Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add static asset-manifest.json book-installation/index.html secure-installation/index.html
          if git diff --cached --quiet; then
            echo "No built changes"
          else
            git commit -m "Publish installation deposit checkout flow"
            git pull --rebase origin main
            git push origin main
          fi
