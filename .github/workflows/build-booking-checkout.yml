name: Build Secure Booking Checkout

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/api.js'
      - 'src/components/QuoteForm.jsx'
      - 'src/pages/InstallationBooking.jsx'
      - '.github/workflows/build-booking-checkout.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build site
        env:
          CI: 'false'
        run: npm run build

      - name: Publish generated assets
        run: |
          mkdir -p static
          cp -R build/static/* static/
          cp build/asset-manifest.json asset-manifest.json

      - name: Commit generated booking build
        run: |
          git config user.name "SplitsPro Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add static asset-manifest.json
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build secure booking checkout"
            git pull --rebase origin main
            git push origin main
          fi
