name: Publish Original SplitsPro Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'craco.config.js'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - '.github/workflows/publish-original-pages.yml'

permissions:
  contents: write

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build original React site
        env:
          CI: 'false'
        run: npm run build

      - name: Publish original routes without replacing homepage
        run: |
          set -e

          rm -rf static
          cp -R build/static static

          ROUTES=(
            "about"
            "split-systems"
            "split-systems/daikin"
            "split-systems/rinnai"
            "split-systems/mitsubishi-electric"
            "split-systems/mitsubishi-heavy-industries"
            "ducted"
            "cleaning"
            "repairs"
            "servicing"
            "gallery"
            "reviews"
            "service-areas"
            "faq"
            "contact"
          )

          for route in "${ROUTES[@]}"; do
            mkdir -p "$route"
            cp build/index.html "$route/index.html"
          done

          cp build/asset-manifest.json asset-manifest.json 2>/dev/null || true

      - name: Commit restored pages
        run: |
          git config user.name "SplitsPro Pages Bot"
          git config user.email "actions@users.noreply.github.com"
          git add static asset-manifest.json about split-systems ducted cleaning repairs servicing gallery reviews service-areas faq contact

          if git diff --cached --quiet; then
            echo "Original pages are already published"
            exit 0
          fi

          git commit -m "Publish restored SplitsPro pages"
          git push
