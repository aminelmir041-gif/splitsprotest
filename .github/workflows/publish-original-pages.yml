name: Publish Original SplitsPro Pages

# Rebuild all React routes together so every page references the same current asset bundle.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/add_rinnai_local_offer.py'
      - 'scripts/refine-rinnai-local-offer.py'
      - 'scripts/restore-rinnai-guide.py'
      - 'scripts/build_hero_dog.py'
      - 'scripts/harden-booking-route.py'
      - '.github/assets/rinnai-guide-part*.txt'
      - '.github/assets/rinnai-guide-v2-part*.txt'
      - 'package.json'
      - 'craco.config.js'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - '.github/workflows/publish-original-pages.yml'

permissions:
  contents: write

concurrency:
  group: splitspro-site-publish
  cancel-in-progress: false

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply final brand booking cleanup
        run: python3 scripts/finalise_brand_booking.py

      - name: Apply Rinnai local offer using the existing Rinnai brand page
        run: python3 scripts/add_rinnai_local_offer.py

      - name: Refine Rinnai local offer layout and terms
        run: python3 scripts/refine-rinnai-local-offer.py

      - name: Restore approved Rinnai back-to-back guide
        run: python3 scripts/restore-rinnai-guide.py

      - name: Prepare landing artwork tools
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Build local offer hero image
        run: python3 scripts/build_hero_dog.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build original React site
        env:
          CI: 'false'
        run: npm run build

      - name: Publish original routes without replacing homepage
        run: |
          set -e

          rm -rf static
          cp -R build/static static

          # Public installation images are referenced by the Rinnai local-offer page.
          # Copy them into the published root as well, otherwise GitHub Pages serves a 404.
          rm -rf installs
          cp -R build/installs installs

          # Public landing-page artwork must also be available at /landing/.
          rm -rf landing
          cp -R build/landing landing

          ROUTES=(
            "about"
            "split-systems"
            "split-systems/daikin"
            "split-systems/rinnai"
            "split-systems/rinnai-local-offer"
            "book-installation"
            "daikin-zena-special"
            "split-systems/mitsubishi"
            "split-systems/mitsubishi-electric"
            "split-systems/mitsubishi-heavy-industries"
            "split-systems/fujitsu"
            "split-systems/samsung"
            "split-systems/oran-park"
            "split-systems/willoughby-north-sydney"
            "split-systems/central-coast-newcastle"
            "split-systems/wollongong"
            "split-systems/quakers-hill-austral-richmond"
            "ducted"
            "cleaning"
            "split-system-cleaning"
            "ducted-cleaning"
            "repairs"
            "servicing"
            "gallery"
            "reviews"
            "service-areas"
            "faq"
            "contact"
          )

          for route in "${ROUTES[@]}"; do
            mkdir -p "$route"
            cp build/index.html "$route/index.html"
          done

          # Keep /deals as an instant redirect so old links/bookmarks never show an
          # intermediate deals hub before reaching the actual offer landing page.
          rm -rf deals
          mkdir -p deals
          cat > deals/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta http-equiv="refresh" content="0; url=../split-systems/rinnai-local-offer/">
            <link rel="canonical" href="https://splitspro.com.au/split-systems/rinnai-local-offer">
            <title>SplitsPro Deals</title>
            <script>
              window.location.replace("../split-systems/rinnai-local-offer/" + window.location.search + window.location.hash);
            </script>
          </head>
          <body>
            <a href="../split-systems/rinnai-local-offer/">View current SplitsPro deals</a>
          </body>
          </html>
          EOF

          cp build/asset-manifest.json asset-manifest.json 2>/dev/null || true

          # Keep the booking route attached to the current hashed bundle and fail
          # this publish immediately if its required assets are missing.
          python3 scripts/harden-booking-route.py

      - name: Commit restored pages
        run: |
          git config user.name "SplitsPro Pages Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.js src/components/Navbar.jsx src/pages/Deals.jsx src/pages/BrandPage.jsx src/pages/ZenaSpecial.jsx src/pages/InstallationBooking.jsx public/installs/rinnai-back-to-back-guide.webp public/landing/overheated-bulldog-hero.webp static installs landing asset-manifest.json about deals split-systems book-installation daikin-zena-special ducted cleaning split-system-cleaning ducted-cleaning repairs servicing gallery reviews service-areas faq contact

          if git diff --cached --quiet; then
            echo "Original pages are already published"
            exit 0
          fi

          git commit -m "Publish restored SplitsPro pages"

          # Another site workflow can finish while this build is running. Rebase onto
          # the newest main branch before pushing so this publish is not rejected.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed; cannot safely publish generated pages."
              exit 1
            fi

            if git push origin main; then
              exit 0
            fi

            echo "Push raced with another update; retrying ($attempt/3)..."
            sleep 3
          done

          echo "Unable to publish after 3 attempts."
          exit 1
