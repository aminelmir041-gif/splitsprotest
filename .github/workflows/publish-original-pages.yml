name: Publish Original SplitsPro Pages

# Rebuild all React routes together so every page references the same current asset bundle.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/add_rinnai_local_offer.py'
      - 'scripts/refine-rinnai-local-offer.py'
      - 'scripts/restore-rinnai-guide.py'
      - '.github/assets/rinnai-guide-part*.txt'
      - '.github/assets/rinnai-guide-v2-part*.txt'
      - 'package.json'
      - 'craco.config.js'
      - 'postcss.config.js'
      - 'tailwind.config.js'
      - '.github/workflows/publish-original-pages.yml'

permissions:
  contents: write

concurrency:
  group: splitspro-site-publish
  cancel-in-progress: false

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Apply final brand booking cleanup
        run: python3 scripts/finalise_brand_booking.py

      - name: Apply Rinnai local offer using the existing Rinnai brand page
        run: python3 scripts/add_rinnai_local_offer.py

      - name: Refine Rinnai local offer layout and terms
        run: python3 scripts/refine-rinnai-local-offer.py

      - name: Restore approved Rinnai back-to-back guide
        run: python3 scripts/restore-rinnai-guide.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build original React site
        env:
          CI: 'false'
        run: npm run build

      - name: Publish original routes without replacing homepage
        run: |
          set -e

          rm -rf static
          cp -R build/static static

          # Public installation images are referenced by the Rinnai local-offer page.
          # Copy them into the published root as well, otherwise GitHub Pages serves a 404.
          rm -rf installs
          cp -R build/installs installs

          ROUTES=(
            "about"
            "split-systems"
            "split-systems/daikin"
            "split-systems/rinnai"
            "split-systems/rinnai-local-offer"
            "split-systems/mitsubishi"
            "split-systems/mitsubishi-electric"
            "split-systems/mitsubishi-heavy-industries"
            "split-systems/fujitsu"
            "split-systems/samsung"
            "split-systems/oran-park"
            "split-systems/willoughby-north-sydney"
            "split-systems/central-coast-newcastle"
            "split-systems/wollongong"
            "split-systems/quakers-hill-austral-richmond"
            "ducted"
            "cleaning"
            "split-system-cleaning"
            "ducted-cleaning"
            "repairs"
            "servicing"
            "gallery"
            "reviews"
            "service-areas"
            "faq"
            "contact"
          )

          for route in "${ROUTES[@]}"; do
            mkdir -p "$route"
            cp build/index.html "$route/index.html"
          done

          cp build/asset-manifest.json asset-manifest.json 2>/dev/null || true

      - name: Commit restored pages
        run: |
          git config user.name "SplitsPro Pages Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/App.js src/pages/BrandPage.jsx public/installs/rinnai-back-to-back-guide.webp static installs asset-manifest.json about split-systems ducted cleaning split-system-cleaning ducted-cleaning repairs servicing gallery reviews service-areas faq contact

          if git diff --cached --quiet; then
            echo "Original pages are already published"
            exit 0
          fi

          git commit -m "Publish restored SplitsPro pages"

          # Another site workflow can finish while this build is running. Rebase onto
          # the newest main branch before pushing so this publish is not rejected.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase failed; cannot safely publish generated pages."
              exit 1
            fi

            if git push origin main; then
              exit 0
            fi

            echo "Push raced with another update; retrying ($attempt/3)..."
            sleep 3
          done

          echo "Unable to publish after 3 attempts."
          exit 1
