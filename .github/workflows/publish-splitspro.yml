name: Build and deploy SplitsPro
# Rebuild requested after fixing missing lockfile
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Repair AJV dependency tree
        run: |
          npm install --no-save --legacy-peer-deps ajv@8.17.1 ajv-keywords@5.1.0
          npm ls ajv ajv-keywords || true
      - name: Build React site
        run: CI=false npm run build
      - name: Preserve client-side routes
        run: cp build/index.html build/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
