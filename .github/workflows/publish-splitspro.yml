name: Build and deploy SplitsPro
# Rebuild requested after fixing missing lockfile
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Repair AJV dependency tree
        run: |
          npm install --no-save --legacy-peer-deps ajv@8.17.1 ajv-keywords@5.1.0
          npm ls ajv ajv-keywords || true
      - name: Repair AJV versions for webpack build
        run: npm install --no-save --legacy-peer-deps ajv@8.17.1 ajv-keywords@5.1.0
      - name: Build React site
        run: CI=false npm run build
      - name: Include original workmanship certificate and installation photos
        run: |
          mkdir -p build/workmanship
          cp workmanship/splitspro-installation-certificate.png build/workmanship/
          cp -R workmanship/photo-gallery build/workmanship/photo-gallery
          test -s build/workmanship/splitspro-installation-certificate.png
          test -s build/workmanship/photo-gallery/01-100144.jpg
      - name: Publish standalone quote and sizing guides
        run: |
          cp -R aircon-quote-guide build/aircon-quote-guide
          cp -R aircon-installation-guide build/aircon-installation-guide
          test -s build/aircon-quote-guide/index.html
          test -s build/aircon-installation-guide/index.html
      - name: Preserve client-side routes
        run: |
          cp build/index.html build/404.html
          mkdir -p build/aircon-deals
          cp build/index.html build/aircon-deals/index.html
          mkdir -p build/ducted
          cp build/index.html build/ducted/index.html
          test -s build/ducted/index.html
          mkdir -p build/split-systems/rinnai-local-offer build/deals
          cp build/index.html build/split-systems/rinnai-local-offer/index.html
          cp build/index.html build/deals/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - id: deployment
        uses: actions/deploy-pages@v4
