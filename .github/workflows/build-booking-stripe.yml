name: Build Stripe Booking Flow

on:
  push:
    branches: [main]
    paths:
      - 'src/lib/api.js'
      - 'src/components/QuoteForm.jsx'
      - 'src/pages/InstallationBooking.jsx'
      - '.github/workflows/build-booking-stripe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-booking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build site
        env:
          CI: 'false'
        run: npm run build

      - name: Publish booking bundle
        run: |
          set -e
          mkdir -p static book-installation
          cp -R build/static/* static/
          cp build/asset-manifest.json asset-manifest.json
          cp build/index.html book-installation/index.html

      - name: Commit generated booking assets
        run: |
          git config user.name "SplitsPro Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add static asset-manifest.json book-installation/index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Publish Stripe booking flow"
            git push
          fi
