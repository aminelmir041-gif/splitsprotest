name: Apply Daikin Editorial Overlap

on:
  push:
    paths:
      - 'scripts/apply_daikin_editorial_overlap.py'
      - '.github/workflows/apply-daikin-editorial-overlap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Daikin editorial overlap
        run: python3 scripts/apply_daikin_editorial_overlap.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build React site
        env:
          CI: 'false'
        run: npm run build

      - name: Publish all React routes together
        run: |
          set -e
          rm -rf static
          cp -R build/static static
          ROUTES=(
            "about"
            "split-systems"
            "split-systems/daikin"
            "split-systems/rinnai"
            "split-systems/mitsubishi"
            "split-systems/mitsubishi-electric"
            "split-systems/mitsubishi-heavy-industries"
            "split-systems/fujitsu"
            "split-systems/samsung"
            "ducted"
            "cleaning"
            "repairs"
            "servicing"
            "gallery"
            "reviews"
            "service-areas"
            "faq"
            "contact"
          )
          for route in "${ROUTES[@]}"; do
            mkdir -p "$route"
            cp build/index.html "$route/index.html"
          done
          cp build/asset-manifest.json asset-manifest.json 2>/dev/null || true

      - name: Commit updated Daikin layout and published routes
        run: |
          git config user.name "SplitsPro Pages Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/data.js src/pages/BrandPage.jsx static asset-manifest.json \
            about split-systems ducted cleaning repairs servicing gallery reviews service-areas faq contact
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Apply Daikin editorial overlap layout"
            git push
          fi
