name: Improve Deposit Hero Quality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/improve-deposit-hero.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get larger checkout hero
        env:
          HERO_HI: "https://media.canva.com/v2/document-image/hash:-1729771325/height:998/id:DAHXeGAfSzc/type:B/width:800?brand=BAFvr7TpwKQ&csig=AAAAAAAAAAAAAAAAAAAAAIH6V-4TvruNW1uaeXBW5CuaF_PUQBgRkCGJ11mh0dJ8&disableexport=T&exp=1791505187&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FAfSzc%2FDAHXeGAfSzc%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261008%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261008T145623Z%26X-Amz-Expires%3D36504%26X-Amz-Signature%3Dc75727669097451c053c24b0ede59c3a44fe6e85763a7c79e834be216490f6b3%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252009%2520Oct%25202026%252001%253A04%253A47%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAJ7xdls8t66AJn1ZVxyBIkAeWwld4cHmj6x5X5Q4UDEN&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1"
          HERO: "https://media.canva.com/v2/document-image/hash:-1729771325/height:499/id:DAHXeGAfSzc/type:B/width:400?brand=BAFvr7TpwKQ&csig=AAAAAAAAAAAAAAAAAAAAAIH6V-4TvruNW1uaeXBW5CuaF_PUQBgRkCGJ11mh0dJ8&disableexport=T&exp=1791505187&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FAfSzc%2FDAHXeGAfSzc%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUHTDF2ZFFQ%252F20261008%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20261008T145623Z%26X-Amz-Expires%3D36504%26X-Amz-Signature%3Dc75727669097451c053c24b0ede59c3a44fe6e85763a7c79e834be216490f6b3%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DFri%252C%252009%2520Oct%25202026%252001%253A04%253A47%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAJ7xdls8t66AJn1ZVxyBIkAeWwld4cHmj6x5X5Q4UDEN&page=1&signed=brand%2Cdisableexport%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1"
        run: |
          set -eu
          mkdir -p landing public/landing
          curl -fsSL --max-time 30 "$HERO_HI" -o /tmp/larger-deposit.png || curl -fsSL --max-time 30 "$HERO" -o /tmp/larger-deposit.png
          python3 -m pip -q install pillow
          python3 - <<'PY'
          from PIL import Image
          image = Image.open('/tmp/larger-deposit.png').convert('RGB')
          print("Hero version size:", image.size)
          assert image.width >= 400, "Hero is lower resolution than expected"
          image.save('landing/splitspro-deposit-hero.webp',format='WEBP',quality=92,method=6)
          image.save('public/landing/splitspro-deposit-hero.webp',format='WEBP',quality=92,method=6)
          PY
      - name: Commit improved image
        run: |
          git config user.name "SplitsPro Checkout Bot"
          git config user.email "actions@users.noreply.github.com"
          git add landing/splitspro-deposit-hero.webp public/landing/splitspro-deposit-hero.webp
          git diff --cached --quiet || (git commit -m "Improve deposit hero image resolution" && git push)
