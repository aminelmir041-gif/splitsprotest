name: Publish SplitsPro Deposit Checkout
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-deposit-checkout.yml'
      - 'src/pages/InstallationDepositCheckout.jsx'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build React app
        run: |
          npm install --legacy-peer-deps --no-audit
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0
          CI=false npm run build
      - name: Publish updated checkout script and retained page loader
        run: |
          set -eu
          rm -rf static
          cp -R build/static static
          cp build/asset-manifest.json asset-manifest.json
          mkdir -p landing secure-installation
          cp public/landing/splitspro-deposit-hero.webp landing/splitspro-deposit-hero.webp
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          manifest=json.loads(Path("asset-manifest.json").read_text())["files"]
          path=Path("secure-installation/index.html")
          html=path.read_text()
          if "splitspro-bundle-loader" not in html:
              raise SystemExit("Checkout manifest loader missing; leaving live route unchanged.")
          html=re.sub(r'/static/js/main\.[a-f0-9]+\.js', manifest["main.js"], html)
          html=re.sub(r'/static/css/main\.[a-f0-9]+\.css', manifest["main.css"], html)
          path.write_text(html)
          PY
      - name: Commit deployed checkout
        run: |
          git config user.name "SplitsPro Checkout Bot"
          git config user.email "actions@users.noreply.github.com"
          git add static asset-manifest.json secure-installation/index.html landing/splitspro-deposit-hero.webp
          if git diff --cached --quiet; then
            echo "Checkout already deployed"
          else
            git commit -m "Publish latest checkout with safe bundle loader"
            git push
          fi
