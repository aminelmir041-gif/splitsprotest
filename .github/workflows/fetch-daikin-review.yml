name: Fetch Fresh Daikin Review

on:
  push:
    paths:
      - '.github/workflows/fetch-daikin-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch a fresh Google review not already used
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          set -euo pipefail
          PLACE_ID=$(tr -d '\r\n ' < .google-place-id)
          curl -sS \
            -H "X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY" \
            -H 'X-Goog-FieldMask: reviews' \
            "https://places.googleapis.com/v1/places/$PLACE_ID" > /tmp/reviews.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/reviews.json').read_text())
          reviews = payload.get('reviews') or []
          repo_text = ''
          for p in [Path('src/lib/data.js'), Path('src/pages/BrandPage.jsx'), Path('src/components/DaikinIntroEditorial.jsx')]:
              if p.exists():
                  repo_text += '\n' + p.read_text(encoding='utf-8', errors='ignore')

          chosen = None
          for r in reviews:
              author = ((r.get('authorAttribution') or {}).get('displayName') or '').strip()
              text = ((r.get('text') or {}).get('text') or '').strip()
              rating = r.get('rating') or 5
              if not text:
                  continue
              if author.lower() == 'sia':
                  continue
              # Skip reviews whose wording is already present in the site source.
              probe = text[:80]
              if probe and probe in repo_text:
                  continue
              chosen = {'author': author or 'Google Customer', 'rating': rating, 'text': text}
              break

          if not chosen:
              raise SystemExit('No unused Google review was returned by Places API')

          out = 'export const DAIKIN_FRESH_REVIEW = ' + json.dumps(chosen, ensure_ascii=False, indent=2) + ';\n'
          Path('src/lib/daikinFreshReview.js').write_text(out, encoding='utf-8')
          print('Selected review from:', chosen['author'])
          print(chosen['text'][:220])
          PY

      - name: Commit selected review
        run: |
          git config user.name "SplitsPro Reviews Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/daikinFreshReview.js
          if git diff --cached --quiet; then
            echo "No review change"
          else
            git commit -m "Add fresh Google review for Daikin landing page"
            git push
          fi
