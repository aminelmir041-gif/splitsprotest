name: Fetch Fresh Daikin Review

on:
  push:
    paths:
      - '.github/workflows/fetch-daikin-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Google reviews returned by Places
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          set -euo pipefail
          PLACE_ID=$(tr -d '\r\n ' < .google-place-id)
          curl -sS \
            -H "X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY" \
            -H 'X-Goog-FieldMask: reviews' \
            "https://places.googleapis.com/v1/places/$PLACE_ID" > /tmp/reviews.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/reviews.json').read_text())
          reviews = payload.get('reviews') or []
          print('REVIEW_COUNT_RETURNED=', len(reviews))
          for i, r in enumerate(reviews):
              author = ((r.get('authorAttribution') or {}).get('displayName') or '').strip()
              text = ((r.get('text') or {}).get('text') or '').strip()
              rating = r.get('rating')
              print(f'REVIEW_{i+1}_AUTHOR={author}')
              print(f'REVIEW_{i+1}_RATING={rating}')
              print(f'REVIEW_{i+1}_TEXT={text[:500]}')
          PY
