name: Fix SplitsPro Logo and Maps

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/fix-logo-maps.yml'

permissions:
  contents: write

jobs:
  fix-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Apply logo and map fixes
        run: python3 scripts/fix_logo_maps.py

      - name: Commit fixes
        run: |
          git config user.name "SplitsPro Site Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/data.js src/components/ServiceAreasMap.jsx index.html
          if git diff --cached --quiet; then
            echo "Logo and maps already fixed"
            exit 0
          fi
          git commit -m "Fix logo paths and add service coverage circles"
          git push
