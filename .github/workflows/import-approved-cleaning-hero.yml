name: Import Approved SplitsPro Cleaning Hero
on:
  push:
    paths:
      - .github/workflows/import-approved-cleaning-hero.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fetch previously approved hero from media delivery endpoint
        env:
          HERO_URL: "https://media.canva.com/v2/image-resize/format:PNG/height:1024/quality:100/uri:ifs%3A%2F%2FM%2F219c6952-aac0-48c6-a89b-9c12a6cf8849/watermark:F/width:1536?csig=AAAAAAAAAAAAAAAAAAAAACSwiXCxg870eezI5hjzy7aHRL1dH-8L8uP8KmoVPPEN&exp=1791874516&osig=AAAAAAAAAAAAAAAAAAAAAGlg7scLy-ffrc1Hv_92f1mikDbRbxmhcSQrBk9cG8CL&signer=media-rpc&token=AAIAAU0AJDIxOWM2OTUyLWFhYzAtNDhjNi1hODliLTljMTJhNmNmODg0OQAAAAABoTQLRCAaVaPzSUiSjUVhVh3vmHNJjd8MUbvFOCGxtBLeU_s88w&x-canva-quality=thumbnail"
        run: |
          set -e
          curl --fail --location --silent --show-error --max-time 90 "$HERO_URL" --output /tmp/splitspro-hero.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('/tmp/splitspro-hero.png')
          print('Retrieved approved art dimensions:',im.size)
          if im.width < 1000 or im.height < 660:
            raise SystemExit('Image resolution too low; refused to replace hero.')
          im.convert('RGB').save('public/landing/splitspro-cleaning-family-hero.webp','WEBP',quality=84,method=6)
          PY
      - name: Publish the approved hero asset
        run: |
          git config user.name "SplitsPro Pages Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/landing/splitspro-cleaning-family-hero.webp
          git commit -m "Add approved family-focused cleaning hero image"
          git pull --rebase origin main
          git push origin HEAD:main
