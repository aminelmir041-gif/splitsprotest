name: Update Google Review Count

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/update-google-reviews.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Fetch live SplitsPro rating and review count
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          set -u
          if [ -z "${GOOGLE_PLACES_API_KEY:-}" ]; then
            echo "GOOGLE_PLACES_API_KEY secret is missing"
            exit 1
          fi

          PLACE_ID=''
          COUNT=''
          RATING=''
          NAME=''
          PHONE=''
          MAP_URL=''

          # Once resolved, reuse the exact Place ID on future hourly runs.
          if [ -f .google-place-id ]; then
            PLACE_ID=$(tr -d '\r\n ' < .google-place-id)
            echo "Using saved Google Place ID: $PLACE_ID"
          fi

          # Precise Place Details lookup when we already know the ID.
          if [ -n "$PLACE_ID" ]; then
            DETAILS=$(curl -sS \
              -H "X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY" \
              -H 'X-Goog-FieldMask: id,displayName,rating,userRatingCount,nationalPhoneNumber,googleMapsUri,pureServiceAreaBusiness' \
              "https://places.googleapis.com/v1/places/$PLACE_ID")
            echo "$DETAILS" > /tmp/place-details.json
            COUNT=$(jq -r '.userRatingCount // empty' /tmp/place-details.json)
            RATING=$(jq -r '.rating // empty' /tmp/place-details.json)
            NAME=$(jq -r '.displayName.text // empty' /tmp/place-details.json)
            PHONE=$(jq -r '.nationalPhoneNumber // empty' /tmp/place-details.json)
            MAP_URL=$(jq -r '.googleMapsUri // empty' /tmp/place-details.json)
          fi

          # SplitsPro is a service-area business, so explicitly include businesses
          # that do not expose a physical street address in Google Maps.
          if [ -z "$COUNT" ] || [ -z "$RATING" ]; then
            QUERIES=(
              "SplitsPro Bass Hill NSW Australia"
              "SplitsPro Sydney Australia"
              "SplitsPro 0414 698 435 Australia"
            )

            for QUERY in "${QUERIES[@]}"; do
              echo "Searching Places API (New): $QUERY"
              BODY=$(jq -n --arg q "$QUERY" '{textQuery:$q,regionCode:"AU",includePureServiceAreaBusinesses:true,pageSize:20}')
              RESPONSE=$(curl -sS -X POST 'https://places.googleapis.com/v1/places:searchText' \
                -H 'Content-Type: application/json' \
                -H "X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY" \
                -H 'X-Goog-FieldMask: places.id,places.displayName,places.rating,places.userRatingCount,places.nationalPhoneNumber,places.googleMapsUri,places.pureServiceAreaBusiness' \
                -d "$BODY")
              echo "$RESPONSE" > /tmp/new-search.json

              # Select the exact business name, not just the first search result.
              MATCH=$(jq -c '[.places[]? | select(((.displayName.text // "") | ascii_downcase) == "splitspro")][0] // empty' /tmp/new-search.json)
              if [ -n "$MATCH" ]; then
                PLACE_ID=$(printf '%s' "$MATCH" | jq -r '.id // empty')
                COUNT=$(printf '%s' "$MATCH" | jq -r '.userRatingCount // empty')
                RATING=$(printf '%s' "$MATCH" | jq -r '.rating // empty')
                NAME=$(printf '%s' "$MATCH" | jq -r '.displayName.text // empty')
                PHONE=$(printf '%s' "$MATCH" | jq -r '.nationalPhoneNumber // empty')
                MAP_URL=$(printf '%s' "$MATCH" | jq -r '.googleMapsUri // empty')
              fi

              if [ -n "$PLACE_ID" ] && [ -n "$COUNT" ] && [ -n "$RATING" ]; then
                break
              fi
            done
          fi

          if [ -z "$PLACE_ID" ] || [ -z "$COUNT" ] || [ -z "$RATING" ]; then
            echo "Could not retrieve the SplitsPro service-area listing from Places API (New)."
            cat /tmp/new-search.json 2>/dev/null || true
            exit 1
          fi

          case "${NAME,,}" in
            splitspro|splits\ pro) ;;
            *)
              echo "Refusing to update from unexpected business: $NAME"
              exit 1
              ;;
          esac

          echo "Confirmed: $NAME — $RATING stars — $COUNT reviews — $PHONE"
          echo "Google Maps: $MAP_URL"
          echo "COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "RATING=$RATING" >> "$GITHUB_ENV"
          printf '%s\n' "$PLACE_ID" > .google-place-id

      - name: Update homepage and restored pages
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          count = os.environ['COUNT']
          rating = os.environ['RATING']
          rating_one_decimal = f"{float(rating):.1f}"
          rating_text = f"{rating_one_decimal} Google Rating"

          # Static homepage.
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'<a href="https://g\.page/r/CYTvO1ipeYUtEBM/"[^>]*>View latest Google reviews</a>',
              f'<span class="live-google-count">{count} verified reviews</span>',
              text,
          )
          text = re.sub(r'\b\d+\s+verified reviews\b', f'{count} verified reviews', text, flags=re.I)
          text = re.sub(r'\b\d(?:\.\d)? Google Rating\b', rating_text, text)
          path.write_text(text, encoding='utf-8')

          # Shared React data used by every restored desktop/mobile page.
          data_path = Path('src/lib/data.js')
          data = data_path.read_text(encoding='utf-8')
          updated = re.sub(
              r'export const GOOGLE_RATING = \{ score: "[^"]+", count: \d+ \};',
              f'export const GOOGLE_RATING = {{ score: "{rating_one_decimal}", count: {count} }};',
              data,
          )
          if updated == data:
              raise SystemExit('Could not find GOOGLE_RATING in src/lib/data.js')
          data_path.write_text(updated, encoding='utf-8')

          # Structured Google rating in the React build template.
          public_path = Path('public/index.html')
          if public_path.exists():
              public = public_path.read_text(encoding='utf-8')
              public = re.sub(r'"ratingValue"\s*:\s*"[^"]+"', f'"ratingValue": "{rating_one_decimal}"', public)
              public = re.sub(r'"reviewCount"\s*:\s*"\d+"', f'"reviewCount": "{count}"', public)
              public_path.write_text(public, encoding='utf-8')
          PY

      - name: Commit only when Google numbers changed
        run: |
          if git diff --quiet -- index.html src/lib/data.js public/index.html .google-place-id 2>/dev/null; then
            echo "No Google review changes to publish"
            exit 0
          fi
          git config user.name "SplitsPro Reviews Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html src/lib/data.js public/index.html .google-place-id
          git commit -m "Update Google rating to ${RATING} and reviews to ${COUNT} everywhere"
          git push
