name: Update Google Review Count

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/update-google-reviews.yml'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

jobs:
  update-reviews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Fetch live Google rating and review count
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: |
          if [ -z "$GOOGLE_PLACES_API_KEY" ]; then
            echo "GOOGLE_PLACES_API_KEY secret is missing"
            exit 1
          fi

          RESPONSE=$(curl -sS -X POST 'https://places.googleapis.com/v1/places:searchText' \
            -H 'Content-Type: application/json' \
            -H "X-Goog-Api-Key: $GOOGLE_PLACES_API_KEY" \
            -H 'X-Goog-FieldMask: places.displayName,places.rating,places.userRatingCount,places.formattedAddress' \
            -d '{"textQuery":"SplitsPro 0414 698 435 Bass Hill NSW Australia"}')

          echo "$RESPONSE" > /tmp/places.json
          COUNT=$(jq -r '.places[0].userRatingCount // empty' /tmp/places.json)
          RATING=$(jq -r '.places[0].rating // empty' /tmp/places.json)
          NAME=$(jq -r '.places[0].displayName.text // empty' /tmp/places.json)

          if [ -z "$COUNT" ] || [ -z "$RATING" ]; then
            echo "Could not read rating/count from Google response"
            cat /tmp/places.json
            exit 1
          fi

          echo "Found: $NAME — $RATING stars — $COUNT reviews"
          echo "COUNT=$COUNT" >> "$GITHUB_ENV"
          echo "RATING=$RATING" >> "$GITHUB_ENV"

      - name: Update website text
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          count = os.environ['COUNT']
          rating = os.environ['RATING']
          rating_text = f"{float(rating):.1f} Google Rating"

          text = re.sub(
              r'<a href="https://g\.page/r/CYTvO1ipeYUtEBM/"[^>]*>View latest Google reviews</a>',
              f'<span class="live-google-count">{count} verified reviews</span>',
              text,
          )
          text = re.sub(r'\b\d+\s+verified reviews\b', f'{count} verified reviews', text)
          text = re.sub(r'\b\d(?:\.\d)? Google Rating\b', rating_text, text)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit only when Google numbers changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No review changes to publish"
            exit 0
          fi
          git config user.name "SplitsPro Reviews Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Update Google rating to ${RATING} and reviews to ${COUNT}"
          git push
