name: Build quote guide HQ image
on:
  push:
    branches: [main]
    paths:
      - 'aircon-quote-guide/assets/.ambitious_chunks/**'
permissions:
  contents: write
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild HQ image
        shell: bash
        run: |
          cat aircon-quote-guide/assets/.ambitious_chunks/*.txt | tr -d '\n\r' | base64 -d > aircon-quote-guide/assets/ambitious-quote-hq.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aircon-quote-guide/assets/ambitious-quote-hq.webp
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild high-resolution ambitious quote image"
          git push
