name: Integrate cleaning VSL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-cleaning-vsl.yml'
      - '.github/scripts/integrate_cleaning_vsl.py'
      - 'assets/splitspro-cleaning-vsl.mp4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add VSL above hero pricing
        run: python .github/scripts/integrate_cleaning_vsl.py

      - name: Commit VSL integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add split-system-cleaning-offer/index.html
          if git diff --cached --quiet; then
            echo "VSL already integrated"
            exit 0
          fi
          git commit -m "Add cleaning VSL above hero pricing"
          git pull --rebase origin main
          git push
