name: Inspect Official Brand Images

on:
  push:
    paths:
      - '.github/workflows/inspect-official-brand-images.yml'
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Pin exact official product image assets
        run: |
          python3 - <<'PY'
          import requests, re, html, urllib.parse
          H={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36'}

          def image_tags(label,url,needles):
              print('\n###',label)
              r=requests.get(url,headers=H,timeout=30)
              t=html.unescape(r.text).replace('\\/','/')
              print('status',r.status_code,'len',len(t))
              seen=set()
              for tag in re.findall(r'<img\b[^>]*>',t,re.I|re.S):
                  low=tag.lower()
                  if any(n.lower() in low for n in needles):
                      attrs=dict((k.lower(),html.unescape(v)) for k,v in re.findall(r'''([\w:-]+)\s*=\s*["']([^"']*)["']''',tag,re.I|re.S))
                      print('IMG',attrs)
                      for k in ('src','data-src','data-lazy-src','srcset','data-srcset'):
                          if attrs.get(k) and attrs[k] not in seen:
                              seen.add(attrs[k]); print(k,urllib.parse.urljoin(r.url,attrs[k]))
              for needle in needles:
                  p=t.lower().find(needle.lower())
                  if p>=0:
                      print('CONTEXT',needle, t[max(0,p-700):p+1100].replace('\n',' ')[:1800])

          image_tags('RINNAI PB','https://www.rinnai.com.au/online/air-conditioning/inverter-split-systems/rinnai-pb-series-inverter-split-systems/2-6kw-pb-series-reverse-cycle-split-system/',['pb series inverter split air conditioner','hinrp26','front'])
          image_tags('RINNAI PX','https://www.rinnai.com.au/online/air-conditioning/inverter-split-systems/rinnai-px-series/px-3-5kw/',['px series inverter split air conditioner','hinrpx35','front'])
          image_tags('MHI CIARA','https://www.mhiaa.com.au/products/series/split-system-air-conditioners-ciara-series/',['ciara','dxk'])
          image_tags('GENERAL/FUJITSU KMTC','https://www.generalairstage.com.au/product/set-astg09kmtc',['astg09kmtc'])

          print('\n### MITSUBISHI ELECTRIC AP')
          print('https://www.mitsubishielectric.com.au/wp-content/uploads/2022/02/AP_70-80HP_front-1920x1440-1-1200x900.png')
          print('\n### SAMSUNG GEO FRONT')
          print('https://images.samsung.com/is/image/samsung/p6pim/au/ar09dxeanwknsa/gallery/au-ar9500tar10dyeabwknst-ar09dxeanwknsa-554025806?$1164_776_PNG$')
          PY
