name: Finish Website Image Upgrade

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/finish-image-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Apply image integration fixes
        run: python3 .github/scripts/finish_image_upgrade.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps
          npm install --legacy-peer-deps --no-save ajv@8.17.1 ajv-keywords@5.1.0

      - name: Build React pages
        env:
          CI: 'false'
        run: npm run build

      - name: Publish all restored routes
        run: |
          set -e
          rm -rf static
          cp -R build/static static
          ROUTES=(
            "about"
            "split-systems"
            "split-systems/daikin"
            "split-systems/rinnai"
            "split-systems/mitsubishi-electric"
            "split-systems/mitsubishi-heavy-industries"
            "split-systems/fujitsu"
            "split-systems/samsung"
            "ducted"
            "cleaning"
            "repairs"
            "servicing"
            "gallery"
            "reviews"
            "service-areas"
            "faq"
            "contact"
          )
          for route in "${ROUTES[@]}"; do
            mkdir -p "$route"
            cp build/index.html "$route/index.html"
          done
          cp build/asset-manifest.json asset-manifest.json 2>/dev/null || true

      - name: Commit image upgrade and rebuilt pages
        run: |
          git config user.name "SplitsPro Images Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src index.html static asset-manifest.json about split-systems ducted cleaning repairs servicing gallery reviews service-areas faq contact
          if git diff --cached --quiet; then
            echo "No image changes to publish"
            exit 0
          fi
          git commit -m "Integrate Daikin images and improve site media"
          git push
