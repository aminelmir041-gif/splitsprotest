name: Verify live cleaning booking readiness
on:
  push:
    branches: [crm-lead-routing]
    paths: [".github/workflows/verify-live-cleaning-readiness.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed API and payment readiness without creating a booking
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base="https://splitspro-leads.onrender.com/api/"
          for endpoint in ("", "cleaning-checkout-config"):
              url=base+endpoint
              response=urllib.request.urlopen(url, timeout=75)
              assert response.status == 200
              result=json.load(response)
              if endpoint:
                  print("Cleaning calendar enabled:", result.get("enabled"))
                  print("Stripe configured:", result.get("stripe_ready"))
                  print("PayPal configured:", result.get("paypal_ready"))
                  print("First system:", result.get("first_system"))
                  print("Additional system:", result.get("each_additional_system"))
                  assert result.get("first_system") == 300
                  assert result.get("each_additional_system") == 150
                  assert result.get("enabled") is True, "Timed cleaning booking rollout is still disabled"
              else:
                  print("Health:", result.get("status"))
          for quantity in (1, 2, 7):
              with urllib.request.urlopen(base + "cleaning-slots?quantity=" + str(quantity) + "&limit=8", timeout=75) as response:
                  assert response.status == 200
                  slots=json.load(response)
                  assert slots.get("quantity") == quantity
                  assert isinstance(slots.get("slots"), list)
                  for slot in slots["slots"]:
                      assert slot["duration_minutes"] == 90 * quantity
                      assert slot["date"] and slot["time"] and slot["end_time"]
                  print("Live slots available for", quantity, "systems:", len(slots["slots"]))
          with urllib.request.urlopen(base + "booking-slots?limit=6", timeout=75) as response:
              assert response.status == 200
              installs=json.load(response)
              assert isinstance(installs.get("slots"), list)
              print("Installation calendar accessible:", len(installs["slots"]), "openings")
          PY
